<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hunter Mobile GAME</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="GAME.css">
</head>
<body>

<canvas id="game"></canvas>

<!-- Joystick -->
<div id="joystick">
  <div id="stick"></div>
</div>

<!-- Attack Button -->
<button id="attack">ATTACK</button>

<!-- HUD -->
<div id="hud">
  <div id="level">Level: 1</div>
  <div id="enemyCount">Enemies: 0</div>
  <div id="instructions">Move with joystick / WASD / arrows. Attack from behind.</div>
</div>

<script src="GAME.js"></script>
</body>
</html>
