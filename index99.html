<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>College Management System</title>
  <link rel="stylesheet" href="/css/style99.css">
</head>
<body>
  <div class="container">
    <h1>College Management System</h1>
    <section>
      <h2>Add Student</h2>
      <form id="studentForm">
        <input name="name" placeholder="Full name" required>
        <input name="dob" type="date" required>
        <input name="city" placeholder="City" required>
        <input name="email" type="email" placeholder="Email" required>
        <button type="submit">Add Student</button>
      </form>
      <div id="studentMsg"></div>
    </section>

    <section>
      <h2>Add Course</h2>
      <form id="courseForm">
        <input name="code" placeholder="Course code (e.g. CS101)" required>
        <input name="title" placeholder="Course title" required>
        <button type="submit">Add Course</button>
      </form>
      <div id="courseMsg"></div>
    </section>

    <section>
      <h2>Enroll Student</h2>
      <form id="enrollForm">
        <select id="studentsSelect"></select>
        <select id="coursesSelect"></select>
        <button type="submit">Enroll</button>
      </form>
      <div id="enrollMsg"></div>
    </section>

    <section>
      <h2>Lists</h2>
      <button id="refresh">Refresh Lists</button>
      <h3>Students</h3>
      <ul id="studentsList"></ul>
      <h3>Courses</h3>
      <ul id="coursesList"></ul>
      <h3>Enrollments</h3>
      <ul id="enrollList"></ul>
    </section>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
